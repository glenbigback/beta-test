name: Build BETA TEST apk

on:
  push:
    branches: [main, master]
  workflow_dispatch: # lets you press "Run workflow" on the Actions tab

env:
  GODOT_VERSION: "4.3"
  PRESET_NAME: "BETA TEST"

permissions:
  contents: write # needed to publish the apk as a Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip (if the project was uploaded as one zip)
        if: hashFiles('project.zip') != ''
        run: unzip -q -o project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK parts Godot 4.3 needs
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot and its export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Debug signing key + Godot editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            cat > "$HOME/.config/godot/$f" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          done

      - name: Android build template (needed for the VR / Quest plugin)
        run: |
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version

      - name: Download the Godot OpenXR Vendors plugin (Quest support)
        if: hashFiles('addons/godotopenxrvendors/**') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VENDORS_TAG: "3.1.2-stable" # a release that works with Godot 4.3
        run: |
          mkdir -p plugin_dl plugin_unz addons
          gh release download "$VENDORS_TAG" --repo GodotVR/godot_openxr_vendors --pattern 'godotopenxrvendorsaddon.zip' --dir plugin_dl
          unzip -q plugin_dl/godotopenxrvendorsaddon.zip -d plugin_unz
          SRC=$(find plugin_unz -type d -name godotopenxrvendors -path "*addons*" | head -n1)
          echo "plugin found at: $SRC"
          cp -r "$SRC" addons/
          rm -rf plugin_dl plugin_unz
          echo "--- plugin files ---"
          find addons/godotopenxrvendors -type f -not -name "*.so" -not -name "*.dll" -not -name "*.dylib" | head -60
          echo "--- plugin export options (for debugging) ---"
          grep -rn -E "meta_xr_features|enable_meta|xr_features/|quest_support|plugins/" addons/godotopenxrvendors --include=*.gd | cut -c1-200 | head -40 || true

      - name: Import the project
        run: godot --headless --path . --import || true

      - name: Export the apk
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "$PRESET_NAME" build/BETA-TEST.apk > export.log 2>&1 || true
          grep -i -E "gradle|openxr|vendors|plugin|error|warning" export.log | cut -c1-220 | head -60 || true
          ls -la build

      - name: Check the apk is a real Quest VR app
        run: python3 tools/check_apk.py build/BETA-TEST.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: BETA-TEST-apk
          path: build/BETA-TEST.apk

      - name: Publish the apk as a Release (plain .apk download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.run_number }}"
          gh release create "$TAG" build/BETA-TEST.apk --title "BETA TEST $TAG" --notes "Debug-signed build for Quest. Download BETA-TEST.apk and install it."
