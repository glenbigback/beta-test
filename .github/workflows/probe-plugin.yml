name: Probe VR plugin releases
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo GodotVR/godot_openxr_vendors --limit 25
          for t in $(gh release list --repo GodotVR/godot_openxr_vendors --limit 25 --json tagName --jq '.[].tagName'); do
            echo "== $t"
            gh release view "$t" --repo GodotVR/godot_openxr_vendors --json assets --jq '.assets[] | "\(.name) \(.size)"' | head -12
          done
