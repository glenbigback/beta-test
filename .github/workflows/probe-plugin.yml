name: Probe plugin options
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 3.1.2-stable --repo GodotVR/godot_openxr_vendors --pattern 'godotopenxrvendorsaddon.zip' --dir dl
          unzip -q dl/godotopenxrvendorsaddon.zip -d unz
          cat unz/asset/addons/godotopenxrvendors/plugin.gdextension | head -30
          find unz -name "*.so" | head
          for f in $(find unz -path "*linux*" -name "*.so" | head -2); do
            echo "== $f"
            strings -n 6 "$f" | grep -E "xr_features|meta_xr|khronos_xr|pico_xr|plugins/|enable_.*_plugin|quest_support|eye_tracking|hand_tracking|passthrough|_support" | grep -v "^_Z" | sort -u | head -60
          done
          echo "== aar manifest hints"
          unzip -p unz/asset/addons/godotopenxrvendors/.bin/android/debug/godotopenxr-meta-debug.aar AndroidManifest.xml | strings | head -40
          unzip -l unz/asset/addons/godotopenxrvendors/.bin/android/debug/godotopenxr-meta-debug.aar | head -30
