name: Probe plugin options
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 3.1.2-stable --repo GodotVR/godot_openxr_vendors --pattern 'godotopenxrvendorsaddon.zip' --dir dl
          unzip -q dl/godotopenxrvendorsaddon.zip -d unz
          cat unz/asset/addons/godotopenxrvendors/plugin.gdextension | head -30
          find unz -name "*.so" | head
          f=unz/asset/addons/godotopenxrvendors/.bin/linux/template_debug/x86_64/libgodotopenxrvendors.so
          echo "== option-like strings"
          strings -n 5 "$f" | grep -E "^[a-z_0-9]+/[a-z_0-9]+$" | sort -u | head -80
          echo "== Quest / meta manifest strings"
          strings -n 5 "$f" | grep -E "com.oculus|horizonos|supportedDevices|quest|vr.headtracking|intent.category" | sort -u | head -40
          echo "== editor plugin hints"
          strings -n 5 "$f" | grep -E "ExportPlugin|EditorPlugin|enable_|Enable " | sort -u | head -30
